<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Settings</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div id="game-container">
    <section class="game-screen active" id="settings-screen">
        <h2 class="screen-title">Settings <span class="emoji">🔧</span></h2>
        <div class="setting-group">
            <p class="setting-label">Language <span class="emoji">🗣️</span></p>
            <p class="setting-value">English <span class="emoji">🇬🇧</span></p>
        </div>
        <div class="setting-group">
            <p class="setting-label">Volume <span class="emoji">🔊</span></p>
            <div class="volume-slider-container">
                <div class="volume-track">
                    <div class="volume-fill" style="width: 50%;"></div>
                    <div class="volume-thumb"></div>
                </div>
                <div class="volume-labels">
                    <span>0</span>
                    <span>50</span>
                    <span>100</span>
                </div>
            </div>
        </div>
        <a class="back-button fixed-bottom-left-button" th:href="@{/}">Back<span class="emoji">⬅️</span></a>
    </section>
</div>
</body>
</html>
