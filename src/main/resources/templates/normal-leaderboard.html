<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Normal Leaderboard</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div id="game-container">
    <section class="game-screen active" id="normal-leaderboard-screen">
        <h2>Normal Mode Scores</h2>
        <div class="leaderboard-table">
            <p th:if="${#lists.isEmpty(entries)}">No scores yet. Be the first!</p>
            <div th:each="entry : ${entries}">
                <p th:text="${entry.playerName} + ' - ' + ${entry.score} + ' - ' + ${#temporals.format(entry.achievedAt, 'dd.MM.yyyy')}"></p>
            </div>
        </div>
        <a class="back-button fixed-bottom-left-button" th:href="@{/highscores}">Back<span class="emoji">⬅️</span></a>
    </section>
</div>
<audio id="background-music" src="/music/background-loop.mp3" loop></audio>
<script src="/js/music-player.js"></script>
</body>
</html>
