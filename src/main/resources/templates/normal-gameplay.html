<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Normal Mode - Brain Tease</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div id="game-container">
    <section class="game-screen active" id="normal-gameplay-screen">

        <!-- The header remains the same, but our padding will prevent overlap -->
        <div class="game-header">
            <div class="game-info" id="score-display" th:text="'Score: ' + ${score}">Score: 0</div>
            <div class="game-info" id="lives-display" th:text="'Lives: ' + ${livesDisplay}">Lives: ❤️❤️❤️</div>
        </div>

        <!-- This is our new, dedicated box for the question text -->
        <div class="question-box">
            <h2 th:text="${question.content}">The question will appear here...</h2>
        </div>

        <!-- =============================================================== -->
        <!-- RENDER THE CORRECT ANSWER FORM BASED ON THE QUESTION TYPE       -->
        <!-- =============================================================== -->

        <!-- MULTIPLE CHOICE FORM (with our new 2x2 grid) -->
        <form th:if="${isMultipleChoice}" method="post" th:action="@{/mode-selection/normal-gameplay/submit}" class="answer-grid">
            <input name="questionId" th:value="${question.id}" type="hidden"/>

            <!-- Loop creates the 4 buttons that will populate the grid -->
            <th:block th:each="option : ${question.options}">
                <button type="submit" name="userAnswer" th:value="${option}" th:text="${option}" class="action-button">
                    Option
                </button>
            </th:block>
        </form>

        <!-- FILL IN THE BLANK FORM -->
        <form th:if="${!isMultipleChoice}" method="post"
              style="display: flex; flex-direction: column; align-items: center; gap: 20px;"
              th:action="@{/mode-selection/normal-gameplay/submit}">

            <input name="questionId" th:value="${question.id}" type="hidden"/>

            <div style="display: flex; align-items: center; gap: 10px; font-size: 1.5em;">
                <span>Answer:</span>
                <input autofocus class="answer-input" id="answer-input" name="userAnswer"
                       required style="width: 150px; font-size: 1em;" type="text">
            </div>

            <button class="action-button" id="submit-answer-button" type="submit">Submit</button>
        </form>

        <!-- The back button remains at the bottom left -->
        <a class="back-button fixed-bottom-left-button" id="normal-game-back-button"
           th:href="@{/mode-selection/normal-gameplay/exit}">Back
            <span class="emoji">⬅️</span>
        </a>

    </section>
</div>
<audio id="background-music" src="/music/background-loop.mp3" loop></audio>
<script src="/js/music-player.js"></script>
<script src="/js/gameplay.js"></script>
</body>
</html>
